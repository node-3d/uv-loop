name: Build Binaries
defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Base release tag/version to build. Defaults to package.json version.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  create_release:
    name: Create Release (Node ${{ matrix.node_major }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node_major: [22, 24, 26]

    steps:

      - name: Fetch Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: 'npm'

      - name: Get Release Tag
        id: release-tag
        run: |
          release_tag="${{ inputs.release_tag }}"
          if [ -z "$release_tag" ]; then
            release_tag="$(node -p "require('./package').version")"
          fi
          echo "version=${release_tag}-${{ matrix.node_major }}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release-tag.outputs.version }}
          name: Release ${{ steps.release-tag.outputs.version }}

  build:
    name: Build (${{ matrix.target }}, Node ${{ matrix.node_major }})
    needs: create_release
    strategy:
      fail-fast: false
      matrix:
        node_major: [22, 24, 26]
        target:
          - windows-x64
          - windows-arm64
          - linux-x64
          - linux-arm64
          - darwin-x64
          - darwin-arm64
        include:
          - target: windows-x64
            os: windows-2022
            node_arch: x64
            archflags: ''
          - target: windows-arm64
            os: windows-11-arm
            node_arch: arm64
            archflags: ''
          - target: linux-x64
            os: ubuntu-22.04
            node_arch: x64
            archflags: ''
          - target: linux-arm64
            os: ubuntu-22.04-arm
            node_arch: arm64
            archflags: ''
          - target: darwin-x64
            os: macos-26-intel
            node_arch: x64
            archflags: '-arch x86_64'
          - target: darwin-arm64
            os: macos-26
            node_arch: arm64
            archflags: '-arch arm64'

    runs-on: ${{ matrix.os }}

    steps:

      - name: Fetch Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_major }}
          architecture: ${{ matrix.node_arch }}
          cache: 'npm'

      - name: Print Native Target
        run: |
          echo "runner=$(uname -s)-$(uname -m)"
          node -p "'node=' + process.version + ' platform=' + process.platform + ' arch=' + process.arch"

      - name: Install Modules
        run: npm ci --ignore-scripts

      - name: Build Current Binary
        run: |
          npm exec -- node-gyp rebuild -j max --silent --directory=src --arch=${{ matrix.node_arch }}
          cd src
          node -e "import('@node-3d/addon-tools').then(function(m){m.cpbin('uv-loop')})"
        env:
          ARCHFLAGS: ${{ matrix.archflags }}

      - name: Get Release Tag
        id: release-tag
        run: |
          release_tag="${{ inputs.release_tag }}"
          if [ -z "$release_tag" ]; then
            release_tag="$(node -p "require('./package').version")"
          fi
          echo "version=${release_tag}-${{ matrix.node_major }}" >> "$GITHUB_OUTPUT"

      - name: Pack Files
        id: pack-files
        run: node -e "import('@node-3d/addon-tools').then((m) => m.actionPack())" >> $GITHUB_OUTPUT

      - name: Attest Binary
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.pack-files.outputs.pack }}

      - name: Store Binaries
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release-tag.outputs.version }}
          name: Release ${{ steps.release-tag.outputs.version }}
          files: ${{ steps.pack-files.outputs.pack }}
