name: Test
defaults:
  run:
    shell: bash

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.target }}, Node ${{ matrix.node_version }})
    strategy:
      fail-fast: false
      matrix:
        node_version: [22.18.0, 24.13.0, 26.8.1]
        include:
          - target: windows-x64
            os: windows-2022
            node_arch: x64
            archflags: ''
          - target: windows-arm64
            os: windows-11-arm
            node_arch: arm64
            archflags: ''
          - target: linux-x64
            os: ubuntu-22.04
            node_arch: x64
            archflags: ''
          - target: linux-arm64
            os: ubuntu-22.04-arm
            node_arch: arm64
            archflags: ''
          - target: darwin-x64
            os: macos-26
            node_arch: x64
            archflags: '-arch x86_64'
          - target: darwin-arm64
            os: macos-26
            node_arch: arm64
            archflags: '-arch arm64'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Fetch Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}
          architecture: ${{ matrix.node_arch }}
          cache: npm

      - name: Print Native Target
        run: |
          echo "runner=$(uname -s)-$(uname -m)"
          node -p "'node=' + process.version + ' platform=' + process.platform + ' arch=' + process.arch"

      - name: Install Modules
        run: npm ci --ignore-scripts

      - name: Build Current Binary
        run: |
          npm exec -- node-gyp rebuild -j max --silent --directory=src --arch=${{ matrix.node_arch }}
          cd src
          node -e "import('@node-3d/addon-tools').then(function(m){m.cpbin('uv-loop')})"
        env:
          ARCHFLAGS: ${{ matrix.archflags }}

      - name: Run Tests
        run: npm run test:ci
